[project]
name = "zillow-scrapper"
version = "0.1.0"
description = "Zillow scraper for Ohio ZIPs: active for-sale listings + nearby sold comps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "homeharvest>=0.8.18",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "python-dateutil>=2.9.0.post0",
    "rich>=13.7.0",
    "certifi>=2024.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "supabase>=2.0.0",
]

[project.scripts]
zillow-scrapper = "zillow_scrapper.cli:app"

[tool.uv]
dev-dependencies = [
  "ruff>=0.1.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
